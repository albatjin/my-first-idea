<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>오늘도 해냈어요</title>
    <style>
      :root {
        --bg-start: #fefce8;
        --bg-end: #fef08a;
        --card-bg: #facc15;
        --card-text: #713f12;
        --card-shadow: rgba(234, 179, 8, 0.35);
        --card-border: rgba(254, 240, 138, 0.9);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        height: 100%;
        font-family: "Segoe UI", "Apple SD Gothic Neo", -apple-system, BlinkMacSystemFont, sans-serif;
        background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
        transition: background 0.6s ease;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1rem;
      }

      .button-card {
        font-size: clamp(1.8rem, 4.5vw, 3.2rem);
        font-weight: 800;
        letter-spacing: -0.03em;
        text-align: center;
        padding: 1.5rem 3rem;
        background: var(--card-bg);
        color: var(--card-text);
        border: 2px solid var(--card-border);
        border-radius: 28px;
        box-shadow: 0 20px 45px var(--card-shadow);
        cursor: pointer;
        user-select: none;
        outline: none;
        transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        backdrop-filter: blur(8px);
      }

      .button-card:hover {
        transform: translateY(-4px) scale(1.02);
        box-shadow: 0 26px 55px var(--card-shadow);
      }

      .button-card:active {
        transform: translateY(2px) scale(0.97);
      }

      .hint {
        margin-top: 1.5rem;
        font-size: 1rem;
        color: #64748b;
        font-weight: 500;
        letter-spacing: -0.01em;
        user-select: none;
      }
      
      .step-indicators {
        display: flex;
        gap: 10px;
        margin-top: 1.2rem;
      }
      
      .indicator {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #cbd5e1;
        transition: all 0.3s ease;
      }
      
      .indicator.active {
        transform: scale(1.3);
      }
    </style>
  </head>
  <body>
    <button class="button-card" id="actionBtn" onclick="nextStep()" aria-label="문장 변경 버튼">
      오늘도 해냈어요
    </button>
    <div class="hint">👆 버튼을 클릭하면 다음 문장과 색상으로 바뀝니다</div>
    <div class="step-indicators" id="indicators">
      <div class="indicator active" style="background: #facc15;"></div>
      <div class="indicator"></div>
      <div class="indicator"></div>
      <div class="indicator"></div>
    </div>

    <script>
      const steps = [
        {
          text: "오늘도 해냈어요",
          bg: "#facc15",          // 노란색 (Yellow)
          textColor: "#713f12",
          border: "rgba(254, 240, 138, 0.9)",
          shadow: "rgba(234, 179, 8, 0.4)",
          bodyBgStart: "#fefce8",
          bodyBgEnd: "#fef08a"
        },
        {
          text: "내일도 기대돼요",
          bg: "#fb923c",          // 주황색 (Orange)
          textColor: "#431407",
          border: "rgba(254, 215, 170, 0.9)",
          shadow: "rgba(249, 115, 22, 0.4)",
          bodyBgStart: "#fff7ed",
          bodyBgEnd: "#fed7aa"
        },
        {
          text: "정말 잘하고 있어요",
          bg: "#4ade80",          // 초록색 (Green)
          textColor: "#052e16",
          border: "rgba(187, 247, 208, 0.9)",
          shadow: "rgba(34, 197, 94, 0.4)",
          bodyBgStart: "#f0fdf4",
          bodyBgEnd: "#bbf7d0"
        },
        {
          text: "언제나 응원해요",
          bg: "#60a5fa",          // 파란색 (Blue)
          textColor: "#082f49",
          border: "rgba(191, 219, 254, 0.9)",
          shadow: "rgba(59, 130, 246, 0.4)",
          bodyBgStart: "#eff6ff",
          bodyBgEnd: "#bfdbfe"
        }
      ];

      let currentIndex = 0;

      function updateUI(index) {
        const step = steps[index];
        const btn = document.getElementById("actionBtn");
        const indicators = document.querySelectorAll(".indicator");
        
        btn.textContent = step.text;
        document.title = step.text;
        
        document.documentElement.style.setProperty("--card-bg", step.bg);
        document.documentElement.style.setProperty("--card-text", step.textColor);
        document.documentElement.style.setProperty("--card-border", step.border);
        document.documentElement.style.setProperty("--card-shadow", step.shadow);
        document.documentElement.style.setProperty("--bg-start", step.bodyBgStart);
        document.documentElement.style.setProperty("--bg-end", step.bodyBgEnd);

        indicators.forEach((ind, i) => {
          if (i === index) {
            ind.classList.add("active");
            ind.style.background = step.bg;
          } else {
            ind.classList.remove("active");
            ind.style.background = "#cbd5e1";
          }
        });
      }

      function nextStep() {
        currentIndex = (currentIndex + 1) % steps.length;
        updateUI(currentIndex);
      }

      // 초기 설정
      updateUI(0);
    </script>
  </body>
</html>
